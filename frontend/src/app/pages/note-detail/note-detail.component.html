<div class="header-row">
    <button mat-icon-button (click)="goBack()" aria-label="Back">
        <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>Note Details</h2>
</div>

<div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
</div>

<div *ngIf="error" class="error-message">
    <p>{{ error }}</p>
    <button mat-raised-button color="warn" (click)="goBack()">Go Back</button>
</div>

<mat-card *ngIf="!loading && note" class="note-detail-card">
    <mat-card-header>
        <mat-card-title>{{ note.title }}</mat-card-title>
        <mat-card-subtitle>
            Uploaded by {{ note.author?.email || 'Anonymous' }} &bull; {{ note.CreatedAt | date:'fullDate' }}
        </mat-card-subtitle>
        <div class="owner-actions" *ngIf="isOwner" style="margin-left: auto;">
            <button mat-icon-button color="primary" [routerLink]="['/notes', note.ID, 'edit']" aria-label="Edit Note">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteNote()" aria-label="Delete Note">
                <mat-icon>delete</mat-icon>
            </button>
        </div>
    </mat-card-header>

    <mat-divider></mat-divider>

    <mat-card-content class="note-content">
        <div class="content-body">
            {{ note.content }}
        </div>
    </mat-card-content>

    <mat-card-footer>
        <div class="footer-info">
            <small>Note ID: {{ note.ID }}</small>
        </div>
    </mat-card-footer>
</mat-card>
